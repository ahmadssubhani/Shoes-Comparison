name: Scrape shoe data

# Started by the "Fetch latest data" button (web/app/api/refresh/route.ts).
# You can also run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max offers per store (smaller = faster refresh)"
        required: false
        default: "40"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Scrape every store, then merge and report
        run: python scraper/scrape_all.py --all --limit "${{ github.event.inputs.limit || '40' }}"
      - name: Upload to Supabase (upsert, keeps existing rows)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scrape_all.py --upload
      - name: Keep offers.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-json
          path: data/offers.json
          if-no-files-found: warn